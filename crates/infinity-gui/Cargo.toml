[package]
name = "infinity-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Infinity-Win desktop program: a live view of the tree and the parameters"

[[bin]]
name = "Infinity-Win"
path = "src/main.rs"

[dependencies]
infinity-core = { workspace = true }
crossbeam-channel = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `eframe`/`egui` is the native Rust GUI of section 4.2: one language, one
# build, one executable per platform, no runtime to install.
#
# Default features only.
eframe = { version = "0.37", default-features = true }
egui = "0.37"

# Native "Add files…" / "Add folder…" dialogs. Windows uses the Win32 common
# dialogs (no extra dependency). On Linux only the xdg-desktop-portal backend
# is enabled: it asks the desktop's own file chooser over D-Bus, so it needs no
# GTK and no system `-dev` packages at build time (DECISIONS.md D3). The
# default `gtk3` and `wayland` features stay off for exactly that reason.
# Pinned: 0.17.2 (January 2026); 0.18 is less than two weeks old.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
