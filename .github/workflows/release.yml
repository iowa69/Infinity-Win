# Release builds for Infinity-Win (PROJECT.md milestone M9).
#
# Why this exists: the development machine is Linux x86-64 with no mingw-w64
# toolchain and no root, so Windows binaries cannot be cross-compiled there.
# `scripts/release.sh` builds and stages the Linux binaries locally and points
# here for Windows; this workflow builds both platforms from the same source.
#
# Triggers:
#   - pushing a tag `v*`  -> builds both platforms AND publishes a GitHub release
#   - manual dispatch     -> builds both platforms, artefacts only
#
# Artefacts (per run): infinity-x86_64-unknown-linux-gnu, infinity-x86_64-pc-windows-msvc

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The workspace pins its target dir in .cargo/config.toml to /tmp/infinity-target,
  # which does not exist on a runner; override it so caching and staging agree.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exe: ''
            rustflags: ''
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: '.exe'
            # Link the C runtime statically so the .exe files run on any
            # Windows 10/11 PC without the Visual C++ Redistributable:
            # unzip and double-click, nothing to install.
            rustflags: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Make sure the host target is installed
        run: rustup target add "${{ matrix.triple }}"

      - name: Cache the cargo registry and the target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.triple }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.triple }}-

      - name: Build the release binaries
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target "${{ matrix.triple }}" --package infinity-cli --package infinity-gui

      - name: Record the version
        run: |
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' Cargo.toml | head -n 1)"
          REF="${GITHUB_REF_NAME:-manual}"
          echo "${VERSION}+${REF}" > VERSION.txt
          cat VERSION.txt

      - name: Stage the binaries
        run: |
          mkdir -p "dist/${{ matrix.triple }}"
          cp "target/${{ matrix.triple }}/release/infinity${{ matrix.exe }}"     "dist/${{ matrix.triple }}/"
          cp "target/${{ matrix.triple }}/release/Infinity-Win${{ matrix.exe }}" "dist/${{ matrix.triple }}/"
          cp VERSION.txt "dist/${{ matrix.triple }}/VERSION"
          cp LICENSE     "dist/${{ matrix.triple }}/LICENSE"
          ls -l "dist/${{ matrix.triple }}"

      - name: Checksums
        run: |
          cd "dist/${{ matrix.triple }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Smoke-test the CLI binary
        run: |
          "dist/${{ matrix.triple }}/infinity${{ matrix.exe }}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: infinity-${{ matrix.triple }}
          path: dist/${{ matrix.triple }}/*
          if-no-files-found: error

  # The benchmark scripts are part of the deliverable (PROJECT.md section 11),
  # and they need no Rust binary to be tested: they run against a fake `infinity`.
  scripts-tests:
    name: benchmark script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Every script must compile
        run: python -m compileall -q scripts
      - name: Unit and integration tests
        run: python -m unittest discover -s scripts/tests -t scripts -v

  release:
    name: publish GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: false

      - name: Bundle one archive per platform
        run: |
          set -euxo pipefail
          mkdir -p release
          for dir in artefacts/infinity-*; do
            triple="${dir##*/infinity-}"
            ( cd "$dir" && zip -r "../../release/infinity-${triple}.zip" . )
          done
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          NOTES_FILE="$(mktemp)"
          {
            echo "Infinity-Win ${GITHUB_REF_NAME}"
            echo
            echo "Binaries for Windows x86-64 and Linux x86-64."
            echo "Verify a download against \`SHA256SUMS.txt\`."
            echo
            echo "Built from commit ${GITHUB_SHA} by the \`release\` workflow."
          } > "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" \
            --title "Infinity-Win ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            release/*.zip release/SHA256SUMS.txt
